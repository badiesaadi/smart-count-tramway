version: "3.8"

services:
  # Edge-AI video processing worker
  counter:
    build:
      context: .
      dockerfile: Dockerfile
    command: python main.py --source 0 --stop Kharouba --headless
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    devices:
      - /dev/video0:/dev/video0

  # Real-time Streamlit monitoring dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - counter
